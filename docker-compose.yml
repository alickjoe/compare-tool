version: '3.8'

services:
  text-compare:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: text-compare-tool
    ports:
      - "3100:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
